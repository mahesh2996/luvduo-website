<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Contact — BaeNest</title>
  <meta name="description" content="Questions, feedback or help with BaeNest? Email admin@baenest.com.">
  <link rel="canonical" href="https://baenest.com/contact/">
  <link rel="icon" href="/assets/app-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/app-icon.png">
  <meta property="og:title" content="Contact — BaeNest">
  <meta property="og:description" content="Questions, feedback or help with BaeNest? We'd love to hear from you.">
  <meta property="og:image" content="https://baenest.com/og-image.jpg">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/site.js" defer></script>
  <script src="/assets/contact.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-label="BaeNest home">
        <img src="/assets/logo-mark.png" width="34" height="34" alt="">
        BaeNest
      </a>
    </div>
  </header>

  <main class="join">
    <div class="wrap">
      <span class="eyebrow"><img class="dot-logo" src="/assets/logo-mark.png" width="22" height="22" alt="">Contact</span>
      <h1>Say <em>hello</em></h1>
      <p class="lead">Questions, feedback or help with your nest? Write to us.</p>

      <div class="card code-card">
        <p class="code-label">Email</p>
        <p class="email" id="email">admin@baenest.com</p>
        <div class="cta-row center-row">
          <a class="btn" href="mailto:admin@baenest.com?subject=BaeNest">Open email app</a>
          <a class="btn btn-ghost" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=admin@baenest.com&amp;su=BaeNest" target="_blank" rel="noopener noreferrer">Write in Gmail</a>
        </div>
        <button class="link-btn" id="copy-email" type="button">Copy address</button>
        <p class="copied" id="copied" role="status"></p>
      </div>

      <h2>Pick a topic</h2>
      <div class="topics">
        <a href="mailto:admin@baenest.com?subject=App%20help"><span aria-hidden="true">💬</span>App help</a>
        <a href="mailto:admin@baenest.com?subject=Delete%20my%20account%20and%20data"><span aria-hidden="true">🗑️</span>Delete my account &amp; data</a>
        <a href="mailto:admin@baenest.com?subject=Feedback"><span aria-hidden="true">💡</span>Feedback &amp; ideas</a>
        <a href="mailto:admin@baenest.com?subject=Partnership"><span aria-hidden="true">🤝</span>Partnerships</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© <span id="year">2026</span> BaeNest</span>
      <nav aria-label="Footer">
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="/contact/" aria-current="page">Contact</a>
      </nav>
    </div>
  </footer>
</body>
</html>
